name: Build CardUniverse Native Android APK

on:
  push:
    branches:
      - carduniverse-android
    paths:
      - "carduniverse-android/**"
      - ".github/workflows/carduniverse-android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build native release APK
        run: gradle -p carduniverse-android :app:assembleRelease

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CardUniverse-Native-Android-2.0.0
          path: carduniverse-android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish downloadable APK release
        if: github.ref == 'refs/heads/carduniverse-android'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: carduniverse-android-v2.0.0-build-${{ github.run_number }}
          name: CardUniverse Native Android v2.0.0 (build ${{ github.run_number }})
          prerelease: true
          generate_release_notes: false
          files: carduniverse-android/app/build/outputs/apk/release/app-release.apk
