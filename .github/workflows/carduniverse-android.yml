name: Build CardUniverse Native Android APK

on:
  push:
    branches:
      - carduniverse-android
    paths:
      - "carduniverse-android/**"
      - ".github/workflows/carduniverse-android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Create preview signing key
        env:
          CU_KEYSTORE_PATH: ${{ runner.temp }}/carduniverse-preview.keystore
          CU_KEYSTORE_PASSWORD: ${{ secrets.CU_PREVIEW_KEYSTORE_PASSWORD || 'cu-preview-only' }}
          CU_KEY_ALIAS: carduniverse
          CU_KEY_PASSWORD: ${{ secrets.CU_PREVIEW_KEY_PASSWORD || 'cu-preview-only' }}
        run: |
          keytool -genkeypair -v \
            -keystore "$CU_KEYSTORE_PATH" \
            -storepass "$CU_KEYSTORE_PASSWORD" \
            -alias "$CU_KEY_ALIAS" \
            -keypass "$CU_KEY_PASSWORD" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=CardUniverse Preview, OU=Android, O=CardUniverse, L=Kuala Lumpur, ST=Kuala Lumpur, C=MY" \
            -noprompt

      - name: Build native release APK
        env:
          CU_KEYSTORE_PATH: ${{ runner.temp }}/carduniverse-preview.keystore
          CU_KEYSTORE_PASSWORD: ${{ secrets.CU_PREVIEW_KEYSTORE_PASSWORD || 'cu-preview-only' }}
          CU_KEY_ALIAS: carduniverse
          CU_KEY_PASSWORD: ${{ secrets.CU_PREVIEW_KEY_PASSWORD || 'cu-preview-only' }}
        run: gradle -p carduniverse-android :app:assembleRelease

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CardUniverse-Native-Android-2.2.0
          path: carduniverse-android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish downloadable APK release
        if: github.ref == 'refs/heads/carduniverse-android'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: carduniverse-android-v2.2.0-build-${{ github.run_number }}
          name: CardUniverse Native Android v2.2.0 (build ${{ github.run_number }})
          prerelease: true
          generate_release_notes: false
          files: carduniverse-android/app/build/outputs/apk/release/app-release.apk
