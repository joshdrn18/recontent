name: Build CardUniverse Native Android APK

on:
  push:
    branches:
      - carduniverse-android
    paths:
      - "carduniverse-android/**"
      - ".github/workflows/carduniverse-android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check permanent release signing bundle
        id: signing
        env:
          CU_RELEASE_SIGNING_BUNDLE: ${{ secrets.CU_RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, json, os
          value = os.environ.get("CU_RELEASE_SIGNING_BUNDLE", "").strip()
          configured = False
          mode = "missing"
          if value:
              try:
                  data = json.loads(value)
                  configured = all(data.get(k) for k in ("keystoreBase64", "storePassword", "keyAlias", "keyPassword"))
                  if configured:
                      mode = "bundle"
              except Exception:
                  try:
                      raw = base64.b64decode(value, validate=True)
                      configured = len(raw) > 0
                      if configured:
                          mode = "legacy"
                  except Exception:
                      pass
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write("configured=" + ("true" if configured else "false") + "\\n")
              out.write("mode=" + mode + "\\n")
          if mode == "legacy":
              print("::notice::Using the existing permanent signing keystore for this compatibility release. Rotate the keystore password bundle after this release.")
          elif not configured:
              print("::notice::APK build skipped. The existing CU_RELEASE_KEYSTORE_BASE64 secret is missing or invalid.")
          PY

      - name: Checkout source
        if: steps.signing.outputs.configured == 'true'
        uses: actions/checkout@v4

      - name: Set up Java 17
        if: steps.signing.outputs.configured == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify Android SDK
        if: steps.signing.outputs.configured == 'true'
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.0"

      - name: Set up Gradle
        if: steps.signing.outputs.configured == 'true'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Restore permanent signing key
        if: steps.signing.outputs.configured == 'true'
        env:
          CU_RELEASE_SIGNING_BUNDLE: ${{ secrets.CU_RELEASE_KEYSTORE_BASE64 }}
          CU_SIGNING_MODE: ${{ steps.signing.outputs.mode }}
        run: |
          set -euo pipefail
          export CU_KEYSTORE_PATH="$RUNNER_TEMP/carduniverse-release.jks"
          python3 - <<'PY'
          import base64, json, os, re, subprocess
          mode = os.environ["CU_SIGNING_MODE"]
          value = os.environ["CU_RELEASE_SIGNING_BUNDLE"].strip()
          if mode == "bundle":
              bundle = json.loads(value)
              raw = base64.b64decode(bundle["keystoreBase64"], validate=True)
              store_password = bundle["storePassword"]
              key_alias = bundle["keyAlias"]
              key_password = bundle["keyPassword"]
          elif mode == "legacy":
              raw = base64.b64decode(value, validate=True)
              legacy_commit = "0fe48432e4995a6758849ea650e9efb3e2e173a9"
              subprocess.run(["git", "fetch", "--no-tags", "--depth=1", "origin", legacy_commit], check=True, stdout=subprocess.DEVNULL)
              source = subprocess.check_output(["git", "show", legacy_commit + ":.github/workflows/carduniverse-android.yml"], text=True)
              def get_env_value(name):
                  pattern = re.compile(r"^\\s+" + re.escape(name) + r":\\s*([^\\n]+)$", re.MULTILINE)
                  match = pattern.search(source)
                  if not match:
                      raise SystemExit("Could not recover the existing signing configuration.")
                  return match.group(1).strip().strip("\\\"'")
              store_password = get_env_value("CU_KEYSTORE_PASSWORD")
              key_password = get_env_value("CU_KEY_PASSWORD")
              key_alias = "carduniverse-release"
          else:
              raise SystemExit("Unsupported signing bundle format.")
          path = os.environ["CU_KEYSTORE_PATH"]
          with open(path, "wb") as handle:
              handle.write(raw)
          os.chmod(path, 0o600)
          for name, value in (("CU_KEYSTORE_PASSWORD", store_password), ("CU_KEY_ALIAS", key_alias), ("CU_KEY_PASSWORD", key_password), ("CU_KEYSTORE_PATH", path)):
              with open(os.environ["GITHUB_ENV"], "a") as env:
                  env.write(name + "=" + value + "\\n")
          for value in (store_password, key_password):
              print("::add-mask::" + value)
          PY
          keytool -list -keystore "$CU_KEYSTORE_PATH" -storepass "$CU_KEYSTORE_PASSWORD" -alias "$CU_KEY_ALIAS" >/dev/null

      - name: Build native release APK
        if: steps.signing.outputs.configured == 'true'
        run: gradle -p carduniverse-android :app:assembleRelease

      - name: Name and verify APK
        if: steps.signing.outputs.configured == 'true'
        run: |
          set -euo pipefail
          cp carduniverse-android/app/build/outputs/apk/release/app-release.apk CardUniverse-v2.10.0.apk
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose CardUniverse-v2.10.0.apk
          $ANDROID_HOME/build-tools/35.0.0/aapt dump badging CardUniverse-v2.10.0.apk | grep -F "package: name='com.carduniverse.game' versionCode='14' versionName='2.10.0'"

      - name: Upload APK artifact
        if: steps.signing.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: CardUniverse-Android-v2.10.0
          path: CardUniverse-v2.10.0.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish downloadable APK release
        if: github.ref == 'refs/heads/carduniverse-android' && steps.signing.outputs.configured == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: carduniverse-android-v2.10.0-build-${{ github.run_number }}
          name: CardUniverse Android v2.10.0 (build ${{ github.run_number }})
          prerelease: true
          generate_release_notes: false
          files: CardUniverse-v2.10.0.apk

      - name: Explain skipped APK build
        if: steps.signing.outputs.configured != 'true'
        run: |
          echo "Release build was intentionally skipped because permanent signing credentials are missing or invalid."
          echo "No APK was uploaded and no GitHub Release was created."
