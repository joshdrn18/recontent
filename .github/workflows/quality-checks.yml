name: ReContent quality checks

on:
  push:
    branches: [design-preview, main]
  pull_request:

jobs:
  syntax-and-config:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          for file in app.js auth.js cloud-sync.js workspace.js 'functions/api/[[path]].js'; do
            echo "Checking $file"
            node --check "$file"
          done
      - name: Validate Wrangler configuration
        run: node -e "JSON.parse(require('node:fs').readFileSync('wrangler.jsonc', 'utf8')); console.log('wrangler.jsonc is valid JSON')"
