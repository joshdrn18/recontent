plugins {
    id 'com.android.application'
}

def signingStoreFile = System.getenv('CU_KEYSTORE_PATH')
def signingStorePassword = System.getenv('CU_KEYSTORE_PASSWORD')
def signingKeyAlias = System.getenv('CU_KEY_ALIAS')
def signingKeyPassword = System.getenv('CU_KEY_PASSWORD')
def hasPermanentReleaseSigning = [signingStoreFile, signingStorePassword,
        signingKeyAlias, signingKeyPassword].every { it != null && !it.trim().isEmpty() }

android {
    namespace 'com.carduniverse.game'
    compileSdk 35

    defaultConfig {
        applicationId 'com.carduniverse.game'
        minSdk 24
        targetSdk 34
        versionCode 25
        versionName '2.20.0'
    }

    signingConfigs {
        release {
            if (hasPermanentReleaseSigning) {
                storeFile file(signingStoreFile)
                storePassword signingStorePassword
                keyAlias signingKeyAlias
                keyPassword signingKeyPassword
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            shrinkResources false
            debuggable false
        }
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig false
    }
}

dependencies {
    implementation 'com.caverock:androidsvg-aar:1.4'
}


// Fail clearly instead of ever producing an update APK with a temporary debug key.
gradle.taskGraph.whenReady { graph ->
    boolean assemblingRelease = graph.allTasks.any {
        it.path.endsWith(':app:assembleRelease')
    }
    if (assemblingRelease && !hasPermanentReleaseSigning) {
        throw new GradleException(
                'Permanent CardUniverse release signing is missing. Configure CU_KEYSTORE_PATH, ' +
                'CU_KEYSTORE_PASSWORD, CU_KEY_ALIAS and CU_KEY_PASSWORD before building a release APK.'
        )
    }
}
